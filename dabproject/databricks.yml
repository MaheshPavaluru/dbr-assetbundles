# This is a Databricks asset bundle definition for dabproject.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabproject
  uuid: f814f8b8-d463-4c12-aa0b-755be9a6148c

include:
  - resources/*.yml
  - resources/*/*.yml


targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
    workspace:
      host: https://dbc-977ec6e0-3e78.cloud.databricks.com/

  prod:
    mode: production
    workspace:
      host: https://dbc-977ec6e0-3e78.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/p.mahesh060@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/p.mahesh060@gmail.com/PROD/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: p.mahesh060@gmail.com
        level: CAN_MANAGE
